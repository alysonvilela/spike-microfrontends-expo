# Local development stack
# ========================
#
# Brings up backend + app-clube together with one command:
#
#   docker compose -f docker-compose.local.yml up --build
#
# Current auth flow (see docs/adr/0002-local-dev-localhost-subdomains.md)
# authenticates over plain HTTP on host-only cookies (no Domain attribute,
# no TLS) — the two services just need to be reachable on the same host
# under different ports. There is no Caddy/subdomain hop in this path;
# real subdomains + TLS are parked (see docs/adr and issue 01).
#
# Verify the composed stack end-to-end:
#
#   bun run scripts/docker-compose-check.ts

name: microfrontends-local

services:
  # ---- Backend (Better Auth + Elysia) ----
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: mf-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
    volumes:
      - backend_data:/app/packages/auth/data
    networks:
      - mf-net

  # ---- app-clube (Next.js) ----
  app-clube:
    build:
      context: .
      dockerfile: apps/app-clube/Dockerfile
    container_name: mf-clube
    restart: unless-stopped
    ports:
      - "${APP_CLUBE_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      # SSR runs inside this container, so it reaches the backend over the
      # compose network by service name — not by the host-published port.
      - AUTH_BASE_URL=http://backend:3001
    networks:
      - mf-net
    depends_on:
      - backend

networks:
  mf-net:
    driver: bridge

volumes:
  backend_data:
